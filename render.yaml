services:
 - type: web
 name: transformai-backend
 env: python
 region: oregon
 plan: free
 buildCommand: pip install -r backend/requirements.txt
 startCommand: python backend/run_backend.py
 envVars:
 - key: BACKEND_PORT
 value: 10000
 - key: BACKEND_HOST
 value: 0.0.0.0
 - key: PYTHONPATH
 value: .
